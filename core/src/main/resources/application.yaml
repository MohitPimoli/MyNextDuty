server:
  port: 8080
  servlet:
    context-path: /core
  error:
    include-stacktrace: never

spring:
  application:
    name: core
    version: v1.0.1
  datasource:
    url: jdbc:postgresql://localhost:5432/mynextduty_db?currentSchema=core
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: MyNextDutyCoreHikariPool
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: core

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_HOST_EMAIL:}
    password: ${MAIL_HOST_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  redis:
    redisson:
      config: |
        singleServerConfig:
          idleConnectionTimeout: 10000
          connectTimeout: 10000
          timeout: 3000
          retryAttempts: 3
          clientName: "mynextduty-core"
          address: "redis://localhost:6379"
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 5
          connectionMinimumIdleSize: 1
          connectionPoolSize: 5
          database: 0
        threads: 5
        username: ${REDIS_USERNAME:default}
        password: ${REDIS_PASSWORD:}
        nettyThreads: 5

# Logging
logging:
  level:
    com.mynextduty: DEBUG
    org.springframework.security: DEBUG

core:
  jwt:
    secret: ${JWT_SECRET:}
    refresh:
      expiration: ${JWT_REFRESH_EXPIRATION:259200}
  baseUrl: ${CORE_BASE_URL:http://localhost:5173}
  lensBaseUrl: ${LENS_BASE_URL:http://localhost:3000}
  email:
    verification:
     tokenExpiryMinutes: ${EMAIL_VERIFICATION_TOKEN_EXPIRY_MINUTES:15}
  rate-limit:
    # Sustained capacity per role (requests allowed in steady state)
    rate-limit-key-prefix: ${CORE_RATE_LIMIT_REDIS_KEY_REFIX:core:rate-limit}
    default-limit: 100
    admin-limit: 500
    customer-limit: 200
    # Token refill: refill-tokens are added every refill-duration seconds
    refill-tokens: 50
    refill-duration: 60
    # Burst multiplier: burst capacity = limit * burst-multiplier
    # Allows short traffic spikes above the sustained rate
    burst-multiplier: 1.5

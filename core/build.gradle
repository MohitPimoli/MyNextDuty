plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'idea'
    id 'java-library'
    id 'jacoco'
    id "org.sonarqube" version "4.4.1.3373"
    id "org.owasp.dependencycheck" version "8.1.2"
}

group = 'com.mynextduty'
description = 'Core for MyNextDuty lens'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2021.0.8"

    }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    implementation 'org.hibernate.orm:hibernate-spatial:6.5.2.Final'

    // JWT dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Redisson
    implementation 'org.redisson:redisson-spring-boot-starter:3.52.0'
    // ReteLimit
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.16.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-mail:4.0.1'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'

    implementation 'tools.jackson.core:jackson-core:3.0.3'
    implementation 'tools.jackson.core:jackson-databind:3.0.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:3.0-rc5'
    implementation 'tools.jackson.datatype:jackson-datatype-jsr353:3.0.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


jacoco {
    toolVersion = "0.8.7"
}

dependencyCheck {
    format = 'JSON'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.named('test') {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/dto/**', '**/co/**', '**/config/**', '**/utils/constant/**', '**/utils/enums/**', '**/utils/records/**', '**/dao/**', '**/enums/**', '**/bootstarp/**', '**/resource/**', '**/validator/annotation/**', '**/migration/**'])
        })
    }
}

sonarqube {
    properties {
        property "sonar.exclusions", "**/dto/**, **/co/**, **/config/**, **/utils/constant/**, **/utils/enums/**, **/utils/records/**, **/dao/**, **/enums/**, **/bootstarp/**, **/resource/**, **/validator/annotation/**, **/migration/**"
    }
}

jar {
    manifest {
        attributes('Class-Path': configurations.collect { it.getName() }.join(' '), 'Main-Class': 'com.mynextduty.core.CoreApplication')
    }
}

apply plugin: "org.owasp.dependencycheck"

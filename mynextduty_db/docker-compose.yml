version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis-container
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass my_redis_pass
      --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_DB: mynextduty_db
      POSTGRES_USER: my_app_user
      POSTGRES_PASSWORD: my_app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_app_user -d mynextduty_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

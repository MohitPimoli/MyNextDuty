plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'idea'
    id 'java-library'
    id 'jacoco'
    id "org.sonarqube" version "4.4.1.3373"
    id "org.owasp.dependencycheck" version "8.1.2"
}

group = 'com.mynextduty'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}


dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2021.0.8"
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0-M8"
    }
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
//	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//    implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springaicommunity:mcp-server-security-spring-boot:0.1.11'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

//	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
    toolVersion = "0.8.7"
}

dependencyCheck {
    format = 'JSON'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}


jacocoTestReport {
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.from = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/dto/**', '**/co/**', '**/config/**', '**/utils/constant/**', '**/utils/enums/**', '**/utils/records/**', '**/dao/**', '**/enums/**', '**/bootstarp/**', '**/resource/**', '**/validator/annotation/**', '**/migration/**'])
        })
    }
}

sonarqube {
    properties {
        property "sonar.exclusions", "**/dto/**, **/co/**, **/config/**, **/utils/constant/**, **/utils/enums/**, **/utils/records/**, **/dao/**, **/enums/**, **/bootstarp/**, **/resource/**, **/validator/annotation/**, **/migration/**"
    }
}

jar {
    manifest {
        attributes('Class-Path': configurations.collect { it.getName() }.join(' '), 'Main-Class': 'com.mynextduty.mcp.McpApplication')
    }
}

apply plugin: "org.owasp.dependencycheck"

